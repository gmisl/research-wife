name: Weekly organic meat report

on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build weekly database and reports
        run: |
          python -m src.bootstrap --database data/research-wife.db --schema schema.sql
          python -m src.import_candidates --database data/research-wife.db --input data/initial_candidates.json
          python -m src.report --database data/research-wife.db --output data/exports/dashboard.html
          python -m src.email_report --database data/research-wife.db --output data/exports/weekly-email.html

      - name: Send email when SMTP secrets are configured
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: |
          if [ -n "$SMTP_HOST" ] && [ -n "$SMTP_USERNAME" ] && [ -n "$SMTP_PASSWORD" ] && [ -n "$EMAIL_RECIPIENT" ]; then
            python -m src.send_email --input data/exports/weekly-email.html
          else
            echo "SMTP secrets not configured; keeping the HTML report as an artifact."
          fi

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-organic-meat-report
          path: data/exports

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: data/exports

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
