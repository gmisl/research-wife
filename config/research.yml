project:
  timezone: Europe/Riga
  initial_start: 2024-01-01
  initial_end: 2026-09-24
  weekly_window_days: 7
  minimum_supplier_priority: primary
  allow_distributors_as_secondary: true
  require_certification: true
  require_frozen: true
  delivery_cost_in_price: false

outputs:
  dashboard: true
  email: true
  email_recipient_env: EMAIL_RECIPIENT
